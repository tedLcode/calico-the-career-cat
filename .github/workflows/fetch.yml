name: fetch-jobs
on:
  schedule:
    # Off the top of the hour on purpose: GitHub delays or drops scheduled
    # runs under load, and load peaks at :00.
    - cron: '17 3 * * *'   # 08:47 IST
    - cron: '47 14 * * *'  # 20:17 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobhunt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node src/run.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit database
        run: |
          git config user.name  "jobhunt-bot"
          git config user.email "jobhunt-bot@users.noreply.github.com"
          git add data/jobs.db
          git diff --staged --quiet && exit 0
          git commit -m "chore: job sync $(date -u +%Y-%m-%dT%H:%M)"
          # Someone may have pushed while this run was fetching (e.g. a code
          # change). Replay the sync commit on top of it; if the database itself
          # conflicts, this run's copy is the newer one, so keep it.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin master; then
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          exit 1
