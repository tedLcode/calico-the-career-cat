name: fetch-jobs
on:
  schedule:
    - cron: '0 3 * * *'    # 08:30 IST
    - cron: '30 14 * * *'  # 20:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobhunt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node src/run.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit database
        run: |
          git config user.name  "jobhunt-bot"
          git config user.email "jobhunt-bot@users.noreply.github.com"
          git add data/jobs.db
          git diff --staged --quiet || git commit -m "chore: job sync $(date -u +%Y-%m-%dT%H:%M)"
          git push
